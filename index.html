<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta dari Google Sheets</title>
    
    <!-- CSS untuk Leaflet (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        /* Mengatur ukuran peta agar memenuhi layar */
        #map { width: 100vw; height: 100vh; } 
    </style>
</head>
<body>

    <!-- Container Peta -->
    <div id="map"></div>

    <!-- Script Leaflet (Peta) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script PapaParse (Untuk membaca CSV Google Sheets) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 1. Inisialisasi Peta (Koordinat awal diatur ke Pontianak)
        const map = L.map('map').setView([-0.0227, 109.3346], 13);

        // 2. Tambahkan layer peta dari OpenStreetMap (Gratis)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Masukkan LINK CSV dari Google Sheets Anda di sini
        // GANTI LINK DI BAWAH INI DENGAN LINK PUBLISH TO WEB MILIK ANDA
        const googleSheetsCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSUOyLOQmEVYOidaszXGbvhCiYh3uJw_b2nzra-xm7n7CHysH0P-SLoU_hWJ3Q1TmLWheS1eGvAD-8A/pub?gid=0&single=true&output=csv';

        // 4. Ambil data dari Google Sheets dan tampilkan di peta
        Papa.parse(googleSheetsCsvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                
                // Looping data dari spreadsheet
                data.forEach(row => {
                    // Pastikan baris memiliki Latitude dan Longitude
                    if (row.Lat && row.Lng) {
                        // Tambahkan Marker ke peta
                        const marker = L.marker([row.Lat, row.Lng]).addTo(map);
                        
                        // Tambahkan Popup saat marker diklik
                        marker.bindPopup(`
                            <b>${row.Nama}</b><br>
                            ${row.Deskripsi}
                        `);
                    }
                });
            },
            error: function(error) {
                console.error("Gagal mengambil data dari Google Sheets:", error);
            }
        });
    </script>
</body>
</html>
