<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SPKLU</title>
    
    <!-- CSS Leaflet untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --pln-blue: #005a9c;
            --pln-cyan: #00a2e9;
            --pln-yellow: #fdb913;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* 1. Header & KPI */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--pln-blue);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .title-area h1 {
            color: var(--pln-blue);
            margin: 0;
            font-size: 28px;
        }
        .kpi-area {
            display: flex;
            gap: 20px;
        }
        .kpi-card {
            text-align: center;
            padding: 10px 20px;
            border-left: 1px solid #ddd;
        }
        .kpi-card h3 {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
        .kpi-card .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--pln-blue);
        }

        /* 2. Styling Panel R4 (Donut Chart) */
        .r4-panel {
            background: #fff;
            border: 2px solid #a6c8e6;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }
        .r4-title {
            background-color: #003380;
            color: #fff;
            font-weight: bold;
            padding: 5px 20px;
            display: inline-block;
            border-bottom-right-radius: 20px;
            border-top-left-radius: 6px;
            margin-top: -2px;
            margin-left: -2px;
        }
        .r4-content {
            display: flex;
            padding: 15px 20px;
            align-items: center;
        }
        .r4-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .vertical-line {
            width: 2px;
            background-color: #a6c8e6;
            height: 120px;
            margin: 0 20px;
        }
        .r4-summary { width: 130px; }
        .badge-green {
            background-color: #1a9c79;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .value-large {
            font-size: 24px;
            font-weight: bold;
            color: #002b5e;
        }
        .unit { font-size: 14px; color: #002b5e; }
        .chart-container { width: 160px; height: 160px; }
        .custom-legend {
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 160px;
        }
        .legend-row { display: flex; align-items: flex-start; gap: 8px; }
        .legend-box { width: 16px; height: 16px; border-radius: 2px; flex-shrink: 0; }
        .legend-text strong { display: block; font-size: 11px; }

        /* 3. Konten Utama: 2 Kolom (Grafik & Peta) */
        .main-content {
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-header {
            background-color: var(--pln-blue);
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .panel-body {
            padding: 15px;
            height: 400px; 
        }
        .panel-peta {
            display: flex;
            flex-direction: column; 
        }
        #map {
            width: 100%;
            flex: 1; 
            border-radius: 4px;
        }

        /* 4. Legenda Peta */
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.ultra { background: #9c27b0; }
        .dot.fast { background: #ff9800; }
        .dot.medium { background: #00a2e9; }

        /* Responsif untuk Layar HP */
        @media (max-width: 768px) {
            .header-section { flex-direction: column; text-align: center; }
            .kpi-area { flex-direction: column; width: 100%; margin-top: 15px; gap: 0; }
            .kpi-card { border-left: none; border-bottom: 1px solid #ddd; padding: 15px 0; }
            .r4-content { flex-direction: column; gap: 20px; }
            .vertical-line { height: 2px; width: 100%; margin: 10px 0; }
            .r4-section { flex-direction: column; text-align: center; gap: 15px; }
            .main-content { flex-direction: column; }
            .custom-legend { align-items: center; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- Bagian 1: Judul dan KPI Atas -->
    <div class="header-section">
        <div class="title-area">
            <h1>PETA & TRANSAKSI</h1>
            <h1>SPKLU PLN</h1>
        </div>
        <div class="kpi-area">
            <div class="kpi-card">
                <h3>TOTAL kWh</h3>
                <div class="value" id="kpi-kwh">0</div>
            </div>
            <div class="kpi-card">
                <h3>TOTAL TRANSAKSI</h3>
                <div class="value" id="kpi-transaksi">0</div>
            </div>
            <div class="kpi-card">
                <h3>TOTAL LOKASI SPKLU</h3>
                <div class="value" id="kpi-spklu">0</div>
            </div>
        </div>
    </div>

    <!-- Bagian 2: Panel Transaksi R4 (Donut Chart) -->
    <div class="r4-panel">
        <div class="r4-title">TRANSAKSI SPKLU R4</div>
        <div class="r4-content">
            
            <!-- Sisi Kiri: TOTAL KWh -->
            <div class="r4-section">
                <div class="r4-summary">
                    <span class="badge-green">TOTAL KWh</span>
                    <div class="value-large" id="donut-total-kwh">0</div>
                    <div class="unit">kWh</div>
                </div>
                <div class="chart-container">
                    <canvas id="kwhDonutChart"></canvas>
                </div>
                <div class="custom-legend" id="legend-kwh"></div>
            </div>

            <div class="vertical-line"></div>

            <!-- Sisi Kanan: TOTAL TRANSAKSI -->
            <div class="r4-section">
                <div class="r4-summary">
                    <span class="badge-green">TOTAL TRANSAKSI</span>
                    <div class="value-large" id="donut-total-trx">0</div>
                    <div class="unit">kali</div>
                </div>
                <div class="chart-container">
                    <canvas id="trxDonutChart"></canvas>
                </div>
                <div class="custom-legend" id="legend-trx"></div>
            </div>

        </div>
    </div>

    <!-- Bagian 3: Grafik dan Peta -->
    <div class="main-content">
        <!-- Panel Grafik Top 10 -->
        <div class="panel">
            <div class="panel-header">TOP 10 TERTINGGI PEMAKAIAN KWH</div>
            <div class="panel-body">
                <canvas id="topChart"></canvas>
            </div>
        </div>

        <!-- Panel Peta Sebaran -->
        <div class="panel">
            <div class="panel-header">PETA SEBARAN SPKLU</div>
            <div class="panel-body panel-peta">
                <div id="map"></div>
                <div class="legend">
                    <div class="legend-item"><span class="dot ultra"></span> Ultra Fast Charger</div>
                    <div class="legend-item"><span class="dot fast"></span> Fast Charger</div>
                    <div class="legend-item"><span class="dot medium"></span> Medium Charger</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Scripts Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    
<script>
    // 1. INISIALISASI PETA 
    const map = L.map('map').setView([-0.0227, 109.3346], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function getMarkerColor(tipe) {
        if (tipe === 'Ultra Fast') return '#9c27b0';
        if (tipe === 'Fast') return '#ff9800';
        return '#00a2e9'; 
    }

    // 2. AMBIL DATA DARI GOOGLE SHEETS
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSUOyLOQmEVYOidaszXGbvhCiYh3uJw_b2nzra-xm7n7CHysH0P-SLoU_hWJ3Q1TmLWheS1eGvAD-8A/pub?gid=0&single=true&output=csv';

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
            const data = results.data.filter(row => row.Nama_SPKLU); 

            // --- A. OLAH DATA UNTUK KPI ATAS ---
            let totalKwh = 0;
            let totalTransaksi = 0;
            
            data.forEach(row => {
                totalKwh += row.Pemakaian_kWh || 0;
                totalTransaksi += row.Total_Transaksi || 0;
            });

            // Tampilkan dengan format tanpa koma desimal
            document.getElementById('kpi-kwh').innerText = totalKwh.toLocaleString('id-ID', { maximumFractionDigits: 0 });
            document.getElementById('kpi-transaksi').innerText = totalTransaksi.toLocaleString('id-ID', { maximumFractionDigits: 0 });
            document.getElementById('kpi-spklu').innerText = data.length;

            // --- B. OLAH DATA UNTUK PETA (LEAFLET) ---
            data.forEach(row => {
                if (row.Lat && row.Lng) {
                    let kwhFormatted = (row.Pemakaian_kWh || 0).toLocaleString('id-ID', { maximumFractionDigits: 0 });
                    L.circleMarker([row.Lat, row.Lng], {
                        radius: 8,
                        fillColor: getMarkerColor(row.Tipe_Charger),
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup(`
                        <b>${row.Nama_SPKLU}</b><br>
                        Tipe: ${row.Tipe_Charger}<br>
                        Pemakaian: ${kwhFormatted} kWh
                    `);
                }
            });

            // --- C. OLAH DATA UNTUK DONUT CHART (R4) ---
            Chart.register(ChartDataLabels);

            let summaryR4 = {
                'Ultra Fast': { kwh: 0, trx: 0, color: '#9c27b0' },
                'Medium': { kwh: 0, trx: 0, color: '#0070c0' },
                'Fast': { kwh: 0, trx: 0, color: '#f07b50' }
            };

            // Hitung total per tipe charger (menggunakan .trim() agar aman dari spasi berlebih di GSheet)
            data.forEach(row => {
                let tipe = (row.Tipe_Charger || '').trim();
                if (summaryR4[tipe]) {
                    summaryR4[tipe].kwh += row.Pemakaian_kWh || 0;
                    summaryR4[tipe].trx += row.Total_Transaksi || 0;
                }
            });

            const labelsR4 = ['FAST CHARGING', 'MEDIUM CHARGING', 'ULTRA FAST CHARGING'];
            const colorsR4 = [summaryR4['Fast'].color, summaryR4['Medium'].color, summaryR4['Ultra Fast'].color];
            
            const kwhValues = [summaryR4['Fast'].kwh, summaryR4['Medium'].kwh, summaryR4['Ultra Fast'].kwh];
            const trxValues = [summaryR4['Fast'].trx, summaryR4['Medium'].trx, summaryR4['Ultra Fast'].trx];

            // Tampilkan total di dalam panel R4 tanpa desimal
            document.getElementById('donut-total-kwh').innerText = totalKwh.toLocaleString('id-ID', { maximumFractionDigits: 0 });
            document.getElementById('donut-total-trx').innerText = totalTransaksi.toLocaleString('id-ID', { maximumFractionDigits: 0 });

            function createDonut(ctxId, dataValues) {
                return new Chart(document.getElementById(ctxId).getContext('2d'), {
                    type: 'doughnut',
                    data: { labels: labelsR4, datasets: [{ data: dataValues, backgroundColor: colorsR4, borderWidth: 1 }] },
                    options: {
                        cutout: '50%',
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                color: '#fff',
                                font: { weight: 'bold', size: 10 },
                                formatter: (value, ctx) => {
                                    let sum = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                    if (sum === 0 || value === 0) return ''; // Cegah error jika data kosong
                                    return (value * 100 / sum).toFixed(1) + "%";
                                }
                            }
                        }
                    }
                });
            }

            createDonut('kwhDonutChart', kwhValues);
            createDonut('trxDonutChart', trxValues);

            function buildLegend(containerId, dataValues, unit) {
                const container = document.getElementById(containerId);
                let html = '';
                labelsR4.forEach((label, index) => {
                    let formattedValue = dataValues[index].toLocaleString('id-ID', { maximumFractionDigits: 0 }) + ' ' + unit;
                    html += `
                        <div class="legend-row">
                            <div class="legend-box" style="background-color: ${colorsR4[index]}"></div>
                            <div class="legend-text">
                                <strong>${label}</strong>
                                ${formattedValue}
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            }

            buildLegend('legend-kwh', kwhValues, 'kWh');
            buildLegend('legend-trx', trxValues, 'kali');

            // --- D. OLAH DATA UNTUK GRAFIK TOP 10 (CHART.JS) ---
            const sortedData = [...data].sort((a, b) => b.Pemakaian_kWh - a.Pemakaian_kWh);
            const top10Data = sortedData.slice(0, 10); 

            const labels = top10Data.map(row => row.Nama_SPKLU);
            const values = top10Data.map(row => row.Pemakaian_kWh);
            const idChargers = top10Data.map(row => row.ID_Charger || '-');

            const ctx = document.getElementById('topChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Pemakaian',
                        data: values,
                        customIds: idChargers,
                        backgroundColor: '#c59b4e',
                        borderWidth: 0
                    }]
                },
                options: {
                    indexAxis: 'y', 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                afterTitle: function(context) {
                                    const index = context[0].dataIndex;
                                    return `ID Charger: ${context[0].dataset.customIds[index]}`;
                                },
                                label: function(context) {
                                    // Memformat nilai kWh di kotak hitam saat disentuh agar tanpa desimal
                                    let val = context.parsed.x || 0;
                                    return `Pemakaian: ${val.toLocaleString('id-ID', { maximumFractionDigits: 0 })} kWh`;
                                }
                            }
                        }
                    }, 
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            grid: { display: false },
                            ticks: { autoSkip: false, maxRotation: 0, minRotation: 0 }
                        }
                    }
                }
            });
            
        }
    });
</script>
</body>
</html>
